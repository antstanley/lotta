name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [fmt, clippy, nextest, deny, audit, rustdoc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        if: matrix.gate == 'nextest' || matrix.gate == 'deny' || matrix.gate == 'audit'
        with:
          tool: ${{ matrix.gate == 'nextest' && 'cargo-nextest@0.9.126' || matrix.gate == 'deny' && 'cargo-deny@0.19.0' || 'cargo-audit@0.22.0' }}
      - name: Check formatting
        if: matrix.gate == 'fmt'
        run: cargo fmt --all --check
      - name: Run Clippy
        if: matrix.gate == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        if: matrix.gate == 'nextest'
        run: cargo nextest run --workspace --all-features
      - name: Check dependencies
        if: matrix.gate == 'deny'
        run: cargo deny check
      - name: Audit dependencies
        if: matrix.gate == 'audit'
        run: cargo audit
      - name: Build documentation
        if: matrix.gate == 'rustdoc'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
