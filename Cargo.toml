[package]
name = "lotta"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lotta-app-server = { version = "0.1.0", path = "crates/lotta-app-server" }
lotta-domain = { version = "0.1.0", path = "crates/lotta-domain" }
chrono.workspace = true
tokio.workspace = true

[dev-dependencies]
lotta-runtime = { version = "0.1.0", path = "crates/lotta-runtime" }
lotta-testkit = { version = "0.1.0", path = "crates/lotta-testkit" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[[test]]
name = "slice"
path = "tests/slice/main.rs"

[workspace]
resolver = "3"
members = [
    "crates/lotta-domain",
    "crates/lotta-protocol",
    "crates/lotta-runtime",
    "crates/lotta-store",
    "crates/lotta-memfs",
    "crates/lotta-providers",
    "crates/lotta-tools",
    "crates/lotta-extensions",
    "crates/lotta-channels",
    "crates/lotta-app-server",
    "crates/lotta-config",
    "crates/lotta-telemetry",
    "crates/lotta-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
axum = { version = "0.8.4", features = ["ws"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde", "std"] }
hmac = "0.12.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.12"
chrono-tz = { version = "0.10.4", features = ["serde"] }
tokio-util = { version = "0.7.16", default-features = false }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tungstenite = "0.29.0"
tokio-tungstenite = "0.29.0"
futures-util = "=0.3.31"
tower = "0.5.3"
url = "2.5.4"
uuid = { version = "1.16.0", features = ["serde"] }

[workspace.dependencies.tokio]
version = "1.47.1"
default-features = false
features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
